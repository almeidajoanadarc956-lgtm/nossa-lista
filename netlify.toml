[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # NEXT_PUBLIC_* values are inlined into the browser bundle by Next.js on purpose.
  # The Supabase URL and anon key are public by design (data access is enforced by
  # Row Level Security), so exclude them from secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
